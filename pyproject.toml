[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computerxrobot"
dynamic = ["version"]
description = "ComputerXRobot-Bench: a simulated robot operates a computer through a physical keyboard and mouse"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Anurag Dhiman"}]
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.24",
    "pygame>=2.5",
    "gymnasium>=1.0",
    "torch>=2.1",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cxr-bench = "benchmark.__main__:main"

# The scene loads assets/ relative to the source tree: install from a checkout with
# `pip install -e .`.
[tool.setuptools]
packages = ["benchmark", "control", "environment", "evaluation", "learning"]

[tool.setuptools.package-data]
environment = ["scene.xml"]

[tool.setuptools.dynamic]
version = {attr = "benchmark.BENCHMARK_VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
